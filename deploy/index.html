<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlkALive Hello World</title>
  <!-- ADR-003/ADR-021: cross-origin isolation (SharedArrayBuffer) requires
       COOP/COEP as HTTP RESPONSE headers — <meta http-equiv> is ignored by
       browsers for this purpose. Serve this directory with:
         node deploy/serve.mjs [port]
       which sets:
         Cross-Origin-Opener-Policy: same-origin
         Cross-Origin-Embedder-Policy: require-corp
       The runtime verifies and logs the isolation state at startup. -->
  <style>body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ime{position:absolute;left:-9999px;opacity:0}</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="ime" type="text">
  <script type="module">
    import init from './pkg/alkalive_runtime_wasm.js';
    const wasm = await init('./pkg/alkalive_runtime_wasm_bg.wasm');
    const canvas = document.getElementById('canvas');
    const ime = document.getElementById('ime');
    // The WASM runtime owns canvas sizing (via devicePixelRatio for high-DPI),
    // the resize listener, the frame loop, input forwarding, renderer
    // selection (WebGPU primary, WebGL2 fallback) and threading posture.
    await wasm.start(canvas, ime);
  </script>
</body>
</html>
