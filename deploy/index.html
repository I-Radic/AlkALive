<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlkALive Hello World</title>
  <!-- ADR-003/ADR-021: cross-origin isolation (SharedArrayBuffer) requires
       COOP/COEP as HTTP RESPONSE headers — <meta http-equiv> is ignored by
       browsers for this purpose. Serve this directory with:
         node deploy/serve.mjs [port]
       which sets:
         Cross-Origin-Opener-Policy: same-origin
         Cross-Origin-Embedder-Policy: require-corp
       The runtime verifies and logs the isolation state at startup. -->
  <!-- Security (docs/security/06-mitigations.md): strict CSP.
       - 'wasm-unsafe-eval' is the minimal allowance needed to compile the
         WebAssembly module (CSP3 source expression); the runtime performs
         NO script eval (JS property reads go through Reflect, so the
         generated glue contains no eval shim).
       - All scripts and styles ship as same-origin external files
         (boot.js, style.css, pkg/) — no inline code, so no inline hashes
         are needed and any injected inline script/style is rejected.
       - Everything else is same-origin only; no objects, no base URLs,
         no form submissions. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="ime" type="text" aria-label="Text input">
  <script type="module" src="./boot.js"></script>
</body>
</html>
