<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlkALive Hello World</title>
  <style>body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh}#ime{position:absolute;left:-9999px;opacity:0}</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <input id="ime" type="text">
  <script type="module">
    import init from './pkg/alkalive_runtime_wasm.js?XTransformPort=8080';
    const wasm = await init('./pkg/alkalive_runtime_wasm_bg.wasm?XTransformPort=8080');
    const canvas = document.getElementById('canvas');
    const ime = document.getElementById('ime');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    await wasm.start(canvas, ime);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
