# cargo-deny configuration — enforces ADR 018 (capability-scoped imports)
# No external registry crates outside an allowlist.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
version = 2
# ADR 018: no external registry deps outside an allowlist.
# The AlkALive runtime is self-contained; all deps are path deps or
# a tightly-controlled allowlist (wgpu/web-sys for the WebGPU binding only).
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = [
    # WebGPU binding (W5-T5) — the sole external registry allowance
    { name = "wgpu", version = "*" },
    { name = "web-sys", version = "*" },
    { name = "js-sys", version = "*" },
    { name = "wasm-bindgen", version = "*" },
]
deny = [
    # Explicitly deny npm-equivalent transitive trust hazards
    { name = "openssl" },
    { name = "reqwest" },
]

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
