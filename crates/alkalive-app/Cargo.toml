[package]
name = "alkalive-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AlkALive application crate — WASM entry points for Hello World"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
alkalive-text = { workspace = true }
wasm-bindgen = { workspace = true }

# We need a panic hook for WASM to get readable panic messages.
# This is a minimal dependency that works with wasm-bindgen.
web-sys = { version = "0.3", features = ["console"] }

[features]
default = []
