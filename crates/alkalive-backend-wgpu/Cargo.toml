[package]
name = "alkalive-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AlkALive GPU rendering backend — WebGL2/WebGPU canvas renderer for WASM"

[lib]
path = "src/lib.rs"

[dependencies]
# Internal workspace crates — text shaping + glyph atlas, scene IR, the
# render-graph IR, and the per-frame TextSceneData.
alkalive-text = { workspace = true }
alkalive-compiler = { workspace = true }
alkalive-render = { workspace = true }
alkalive-scene-data = { workspace = true }

# bytemuck for typed byte reinterpretation of vertex/uniform buffers.
bytemuck = { version = "1", features = ["derive"] }

# wasm-bindgen + web-sys for browser DOM/Canvas/WebGL2 bindings.
# These compile on native too (the types are referenced) but the GPU
# runtime calls are only meaningful on wasm32.
wasm-bindgen = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "Gpu",
    "GpuCanvasContext",
    "GpuDevice",
    "GpuQueue",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "console",
    "Performance",
] }

[features]
default = ["wgpu-backend"]
# Enable the wgpu-based renderer with WGSL shaders (ADR-006).
# When disabled, falls back to the raw WebGL2 backend with GLSL.
wgpu-backend = ["dep:wgpu"]

[dev-dependencies]
# naga is used in unit tests to statically validate the WGSL shader sources
# (parse + validation + interface checks) without needing a GPU device.
naga = { version = "24", default-features = false, features = ["wgsl-in"] }

[dependencies.wgpu]
version = "24"
features = ["webgl"]
optional = true
default-features = true
