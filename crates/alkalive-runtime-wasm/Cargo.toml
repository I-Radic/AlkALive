[package]
name = "alkalive-runtime-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AlkALive pure runtime — WASM entry point with GPU rendering"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Internal workspace crates — GPU backend, compiler, and text stack.
alkalive-backend-wgpu = { workspace = true }
alkalive-compiler = { workspace = true }
alkalive-text = { workspace = true }
alkalive-render = { workspace = true }
alkalive-scene-data = { workspace = true }

# wasm-bindgen + web-sys for browser DOM/Canvas/WebGL2/event bindings.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "HtmlInputElement",
  "Window",
  "Document",
  "Element",
  "EventTarget",
  "KeyboardEvent",
  "InputEvent",
  "MouseEvent",
  "console",
  "Performance",
] }

[features]
default = ["wgpu-backend"]
# Forward the wgpu-backend feature to the GPU backend crate. When enabled
# (the default), the runtime selects the wgpu/WGSL renderer (ADR-006) as the
# primary production backend and falls back to raw WebGL2/GLSL if WebGPU
# initialization fails. When disabled, only the GLSL fallback is built.
wgpu-backend = ["alkalive-backend-wgpu/wgpu-backend"]
