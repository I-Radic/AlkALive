[package]
name = "harfrust"
version = "0.12.0"
edition = "2021"
rust-version = "1.85"
description = "A complete HarfBuzz shaping algorithm port to Rust."
repository = "https://github.com/harfbuzz/harfrust"
license = "MIT"
readme = "../README.md"
keywords = ["text", "shaping", "opentype", "truetype"]
categories = ["text-processing"]
exclude = ["benches/", "tests/"]

[dependencies]
read-fonts = { version = "0.41.0", default-features = false, features = ["experimental_font_api"] }
bitflags = "2.9"
bytemuck = { version = "1.22", features = ["extern_crate_alloc"] }
core_maths = { version = "0.1", optional = true }
smallvec = "1.14"
icu_properties = { version = "2.2.0", optional = true }
icu_normalizer = { version = "2.2.0", optional = true }

[features]
default = ["std"]
std = ["read-fonts/std"]
libm = ["dep:core_maths", "read-fonts/libm"]
experimental_font_api = []
icu = ["dep:icu_properties", "dep:icu_normalizer"]

[lib]
bench = false
